name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # better-sqlite3 13 and @stellar/stellar-sdk 17 require Node.js 22.12 or newer,
      # so Node 20 cannot install the dependencies. Matches NODE_VERSION in render.yaml.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed demo database
        run: npm run seed

      - name: Run API tests
        run: npm test

      - name: Run VS Code extension tests
        working-directory: pluglytics-vscode
        run: npm test
